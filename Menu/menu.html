<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <link rel="stylesheet" href="../styles/modals.css">
    <link rel="stylesheet" href="menu/menu.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <!-- Menu Modal -->
    <div id="menuModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="menu-container">
            <button class="btn-close" aria-label="Fermer">
                <span class="material-icons">close</span>
            </button>
            
            <div class="menu-content">
                <div class="menu-left">
                    <button class="menu-btn" data-action="itineraries">
                        <span class="material-icons">route</span>
                        Mes Itinéraires
                    </button>
                    <button class="menu-btn" data-action="synthese">
                        <span class="material-icons">analytics</span>
                        Synthèse
                    </button>
                    <button class="menu-btn" data-action="calendar">
                        <span class="material-icons">calendar_today</span>
                        Calendrier
                    </button>
                    <button class="menu-btn" data-action="notifications">
                        <span class="material-icons">notifications</span>
                        Notifications
                    </button>
                    <button class="menu-btn" data-action="profile">
                        <span class="material-icons">person</span>
                        Profile
                    </button>
                    <button class="menu-btn" data-action="settings">
                        <span class="material-icons">settings</span>
                        Paramètres
                    </button>
                    <button class="logout-btn" data-action="logout">
                        <span class="material-icons">logout</span>
                        Se déconnecter
                    </button>
                </div>
                
                <div class="menu-right">
                    <!-- Contenu dynamique -->
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
