<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
</head>
<body>
    <!-- Menu Modal -->
    <div id="menuModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="menu-container">
            <div class="menu-content">
                <div class="menu-left">
                    <button class="menu-option-btn" data-action="synthese">
                        <span class="material-icons">analytics</span>
                        Synthèse
                    </button>
                    <button class="menu-option-btn" data-action="itineraries">
                        <span class="material-icons">route</span>
                        Mes Itinéraires
                    </button>
                    <button class="menu-option-btn" data-action="calendar">
                        <span class="material-icons">calendar_today</span>
                        Calendrier
                    </button>
                    <button class="menu-option-btn" data-action="notifications">
                        <span class="material-icons">notifications</span>
                        Notifications
                    </button>
                    <button class="menu-option-btn" data-action="profile">
                        <span class="material-icons">person</span>
                        Profile
                    </button>
                    <button class="menu-option-btn" data-action="settings">
                        <span class="material-icons">settings</span>
                        Paramètres
                    </button>
                    <button class="menu-option-btn logout-btn" data-action="logout">
                        <span class="material-icons">logout</span>
                        Deconnexion
                    </button>
                </div>
                
                <div class="menu-right">
                    <!-- Header mobile avec boutons menu/retour -->
                    <div class="menu-header">
                        <button class="menu-back-btn" id="menuBackBtn" data-action="show-navigation">
                            <span class="material-icons">menu</span>
                        </button>
                        <div class="menu-breadcrumb" id="menuBreadcrumb">
                            <span>Menu</span>
                            <span class="separator">></span>
                            <span class="current" id="breadcrumbCurrent">Synthèse</span>
                        </div>
                    </div>
                    
                    <!-- Contenu dynamique -->
                    <div class="menu-content-wrapper" id="menuContent">
                        <!-- Le contenu sera chargé ici -->
                        <div class="menu-section">
                            <div class="section-content">
                                <p>Sélectionnez une option dans le menu</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
