name: Auto Update Version

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Update version
      run: |
        echo "🔄 Début de la mise à jour automatique de version"
        
        # Extraire la version actuelle depuis le service worker
        CURRENT_VERSION=$(grep "const CACHE_VERSION = " services/service-worker.js | sed "s/const CACHE_VERSION = '\([^']*\)'.*/\1/")
        echo "📋 Version actuelle: $CURRENT_VERSION"
        
        # Incrémenter la version (patch par défaut)
        IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
        MAJOR=${ADDR[0]}
        MINOR=${ADDR[1]}
        PATCH=${ADDR[2]}
        PATCH=$((PATCH + 1))
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        
        echo "📦 Nouvelle version: $NEW_VERSION"
        
        # Mettre à jour uniquement service-worker.js
        sed -i "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = \"$NEW_VERSION\"/" services/service-worker.js
        echo "✅ Service worker mis à jour"
        
        # Vérifier les changements
        echo "🔍 Vérification des changements:"
        grep "const CACHE_VERSION = " services/service-worker.js
        
        # Commiter les changements
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add services/service-worker.js
        git commit -m "🔄 Auto-update version to $NEW_VERSION"
        git push
        
        echo "🚀 Version $NEW_VERSION déployée avec succès"
