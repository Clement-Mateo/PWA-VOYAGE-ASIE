name: Auto Update Version

on:
  push:
    branches: [ main ]

jobs:
  update-version:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update version
      run: |
        echo "🔄 Début de la mise à jour automatique de version"
        
        # Extraire la version actuelle
        CURRENT_VERSION=$(grep "this.currentVersion = " version-management/cache-version-manager.js | sed "s/.*'\(.*\)'.*/\1/")
        echo "📋 Version actuelle: $CURRENT_VERSION"
        
        # Incrémenter la version (patch par défaut)
        IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
        MAJOR=${ADDR[0]}
        MINOR=${ADDR[1]}
        PATCH=${ADDR[2]}
        PATCH=$((PATCH + 1))
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        
        echo "📦 Nouvelle version: $NEW_VERSION"
        
        # Mettre à jour cache-version-manager.js
        sed -i "s/this.currentVersion = '$CURRENT_VERSION'/this.currentVersion = '$NEW_VERSION'/" version-management/cache-version-manager.js
        
        # Mettre à jour service-worker.js
        sed -i "s/voyage-asie-v$CURRENT_VERSION/voyage-asie-v$NEW_VERSION/" services/service-worker.js
        
        echo "✅ Fichiers mis à jour"
        
        # Vérifier les changements
        echo "🔍 Vérification des changements:"
        grep "this.currentVersion = " version-management/cache-version-manager.js
        grep "CACHE_NAME = " services/service-worker.js
        
        # Commiter les changements
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add version-management/cache-version-manager.js services/service-worker.js
        git commit -m "🔄 Auto-update version to $NEW_VERSION"
        git push
        
        echo "🚀 Version $NEW_VERSION déployée avec succès"
