<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte du Monde Interactive</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CarteInteractive">
    
    <!-- Google Fonts pour Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Styles globaux -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/drag-drop.css">
    <link rel="stylesheet" href="components/AuthPopup/AuthPopup.css">
    <link rel="stylesheet" href="components/Login/Login.css">
    <link rel="stylesheet" href="components/Destinations/Destinations.css">
    <link rel="stylesheet" href="components/Destinations/ChooseAddress/ChooseAddress.css">
    <link rel="stylesheet" href="components/LeafletMap/LeafletMap.css">
</head>
<body>
    <div id="map"></div>
    
    <!-- Bouton de déconnexion (masqué par défaut) -->
    <button class="auth-btn" id="logoutBtn" style="display: none;" onclick="handleLogout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2 2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
    </button>
    
    <!-- Bouton pour afficher les destinations (masqué par défaut) -->
    <button class="destinations-toggle-btn" id="destinationsBtn" style="display: none;" onclick="window.Destinations.toggle()">
        📍
    </button>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- Leaflet Polyline Decorator Plugin -->
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    
    <!-- Firebase SDK v12 -->
    <script type="module">
        // Importer les modules Firebase nécessaires
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDoc, getDocs, query, where, orderBy, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBdO1hs92ZlaVNeefwu2Yqhdb-2nDLo4Vk",
            authDomain: "pwa-voyage-asie.firebaseapp.com",
            projectId: "pwa-voyage-asie",
            storageBucket: "pwa-voyage-asie.firebasestorage.app",
            messagingSenderId: "952612056038",
            appId: "1:952612056038:web:318e446aa787783f77c427",
            measurementId: "G-E0WFHDHCST"
        };
        
        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Exporter globalement pour notre service
        window.firebase = {
            app,
            db,
            auth,
            initializeApp,
            getFirestore,
            collection,
            doc,
            addDoc,
            updateDoc,
            deleteDoc,
            getDoc,
            getDocs,
            query,
            where,
            orderBy,
            serverTimestamp,
            arrayUnion,
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            sendPasswordResetEmail
        };
        
        // Initialiser notre service Firebase
        console.log('Modules Firebase chargés, initialisation du service...');
        if (window.firebaseService) {
            window.firebaseService.initialize();
        }
        
        // Test de configuration Firebase
        setTimeout(() => {
            console.log('=== TEST CONFIGURATION FIREBASE ===');
            console.log('Firebase disponible:', typeof window.firebase !== 'undefined');
            console.log('Service initialisé:', window.firebaseService.isInitialized);
            console.log('Auth disponible:', typeof window.firebase.auth !== 'undefined');
            console.log('getDoc disponible:', typeof window.firebase.getDoc !== 'undefined');
            console.log('User connecté:', window.firebaseService.isAuthenticated());
            console.log('=====================================');
        }, 2000);
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => console.log('Service Worker enregistré'))
                .catch(error => console.log('Service Worker erreur:', error));
        }
    </script>
    
    <!-- Firebase Service -->
    <script src="firebaseService.js"></script>
    
    <!-- Composants -->
    <script src="components/Login/Login.js"></script>
    <script src="components/Destinations/Destinations.js"></script>
    <script src="components/Destinations/ChooseAddress/ChooseAddress.js"></script>
    <script src="components/LeafletMap/LeafletMap.js"></script>
    
    <!-- Component Manager -->
    <script type="module">
        // Importer les composants
        import { ComponentManager } from './components/ComponentManager.js';
        
        // Enregistrer les composants
        ComponentManager.register('destinations', Destinations);
        
        // Exporter globalement
        window.ComponentManager = ComponentManager;
        window.Destinations = Destinations;
        window.ChooseAddress = ChooseAddress;
        window.LeafletMap = LeafletMap;
        
        // Initialiser les composants quand le DOM est prêt
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM prêt, initialisation des composants...');
            
            // Initialiser Login
            if (window.Login) {
                window.Login.init();
            }
            
            // Initialiser ChooseAddress
            if (window.ChooseAddress) {
                console.log('✅ ChooseAddress trouvé, initialisation...');
                window.ChooseAddress.init();
            } else {
                console.error('❌ ChooseAddress non trouvé');
            }
            
            // Initialiser Destinations
            if (window.Destinations) {
                window.Destinations.init();
            }
            
            // Initialiser LeafletMap
            if (window.LeafletMap) {
                const mapInstance = new window.LeafletMap(); // Utiliser LeafletMap
                mapInstance.init();
                mapInstance.exportForLegacy();
                window.MapInstance = mapInstance;
                console.log('✅ LeafletMap initialisée et exportée pour compatibilité');
            }
            
            await ComponentManager.initAll();
        });
    </script>
    
    <script>
        // Variables globales
        let searchTimeout;
        let currentSelectedResult;
        let isSearching = false;
        let isOnline = navigator.onLine;
        
        // Fonction de déconnexion
        function handleLogout() {
            console.log('Tentative de déconnexion...');
            
            if (window.MapInstance && window.MapInstance.cleanMap) {
                window.MapInstance.cleanMap();
            }
            
            if (window.firebaseService) {
                window.firebaseService.signOut()
                    .then(() => {
                        console.log('Déconnexion réussie');
                        if (window.updateUserPanel) {
                            window.updateUserPanel();
                        }
                    })
                    .catch((error) => {
                        console.error('Erreur de déconnexion:', error);
                    });
            } else {
                console.error('FirebaseService non disponible pour la déconnexion');
            }
        }
        
        // Mettre à jour l'affichage des destinations après connexion
        async function updateUserPanel() {
            const logoutBtn = document.getElementById('logoutBtn');
            const destinationsBtn = document.getElementById('destinationsBtn');
            
            if (window.firebaseService.isAuthenticated()) {
                // Utilisateur connecté
                console.log('✅ Utilisateur connecté - Mise à jour de l\'interface');
                
                // Masquer la page de connexion
                if (window.Login) {
                    window.Login.hide();
                }
                
                // Afficher la carte
                if (window.MapInstance) {
                    window.MapInstance.show();
                }
                
                // Charger et afficher les destinations
                if (window.Destinations) {
                    window.Destinations.loadDestinations();
                    window.Destinations.show();
                }
                
                // Afficher le bouton de déconnexion
                if (logoutBtn) {
                    logoutBtn.style.display = 'flex';
                }
                
                // Afficher le bouton destinations
                if (destinationsBtn && window.Destinations) {
                    destinationsBtn.style.display = 'block';
                }
            } else {
                // Utilisateur déconnecté
                console.log('🔒 Utilisateur déconnecté - Affichage de la page de connexion');
                
                // Afficher la page de connexion
                if (window.Login) {
                    window.Login.show();
                }
                
                // Masquer les boutons
                if (logoutBtn) {
                    logoutBtn.style.display = 'none';
                }
                
                if (destinationsBtn) {
                    destinationsBtn.style.display = 'none';
                }
                
                // Effacer les marqueurs lors de la déconnexion
                if (window.MapInstance && window.MapInstance.cleanMap) {
                    window.MapInstance.cleanMap();
                }
            }
        }
        
        // Vérifier l'état de connexion au chargement
        setTimeout(() => {
            if (window.firebase && window.firebase.auth) {
                window.firebase.auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        window.firebaseService.user = user;
                        console.log('Utilisateur connecté:', user.email);
                        
                        // Créer un itinéraire si aucun n'existe
                        await window.firebaseService.ensureUserItinerary();
                        
                        updateUserPanel();
                    } else {
                        window.firebaseService.user = null;
                        console.log('Utilisateur déconnecté');
                        
                        updateUserPanel();
                    }
                });
            } else {
                console.warn('⚠️ Firebase non encore initialisé, nouvelle tentative dans 2 secondes');
                setTimeout(() => {
                    if (window.firebase && window.firebase.auth) {
                        window.firebase.auth.onAuthStateChanged(async (user) => {
                            if (user) {
                                window.firebaseService.user = user;
                                console.log('Utilisateur connecté:', user.email);
                                await window.firebaseService.ensureUserItinerary();
                                updateUserPanel();
                            } else {
                                window.firebaseService.user = null;
                                console.log('Utilisateur déconnecté');
                                updateUserPanel();
                            }
                        });
                    }
                }, 2000);
            }
        }, 1000);

        // Écouter les changements de connexion
        window.addEventListener('online', () => {
            isOnline = true;
            console.log('Connexion rétablie - API activée');
        });
        
        window.addEventListener('offline', () => {
            isOnline = false;
            console.log('Connexion perdue - API désactivée');
        });
        
        // Exporter les fonctions globalement
        window.updateUserPanel = updateUserPanel;
        window.handleLogout = handleLogout;
    </script>
</body>
</html>
