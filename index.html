<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte du Monde Interactive</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CarteInteractive">
    
    <!-- Google Fonts pour Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Styles globaux -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/drag-drop.css">
    <link rel="stylesheet" href="components/AuthPopup/AuthPopup.css">
    <link rel="stylesheet" href="components/Destinations/Destinations.css">
    <link rel="stylesheet" href="components/ChooseAddress/ChooseAddress.css">
</head>
<body>
    <div id="map"></div>
    
    <button class="auth-btn" onclick="AuthPopup.show()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
    </svg>
</button>
    
    <!-- Conteneur pour le popup de connexion -->
    <div id="authPopupContainer"></div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- Firebase SDK v12 -->
    <script type="module">
        // Importer les modules Firebase nécessaires
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, getDoc, getDocs, query, where, orderBy, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
        
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBdO1hs92ZlaVNeefwu2Yqhdb-2nDLo4Vk",
            authDomain: "pwa-voyage-asie.firebaseapp.com",
            projectId: "pwa-voyage-asie",
            storageBucket: "pwa-voyage-asie.firebasestorage.app",
            messagingSenderId: "952612056038",
            appId: "1:952612056038:web:318e446aa787783f77c427",
            measurementId: "G-E0WFHDHCST"
        };
        
        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Exporter globalement pour notre service
        window.firebase = {
            app,
            db,
            auth,
            initializeApp,
            getFirestore,
            collection,
            doc,
            addDoc,
            updateDoc,
            deleteDoc,
            getDoc,
            getDocs,
            query,
            where,
            orderBy,
            serverTimestamp,
            arrayUnion,
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        };
        
        // Initialiser notre service Firebase
        console.log('Modules Firebase chargés, initialisation du service...');
        if (window.firebaseService) {
            window.firebaseService.initialize();
        }
        
        // Test de configuration Firebase
        setTimeout(() => {
            console.log('=== TEST CONFIGURATION FIREBASE ===');
            console.log('Firebase disponible:', typeof window.firebase !== 'undefined');
            console.log('Service initialisé:', window.firebaseService.isInitialized);
            console.log('Auth disponible:', typeof window.firebase.auth !== 'undefined');
            console.log('getDoc disponible:', typeof window.firebase.getDoc !== 'undefined');
            console.log('User connecté:', window.firebaseService.isAuthenticated());
            console.log('=====================================');
        }, 2000);
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => console.log('Service Worker enregistré'))
                .catch(error => console.log('Service Worker erreur:', error));
        }
    </script>
    
    <!-- Firebase Service -->
    <script src="firebaseService.js"></script>
    
    <!-- Composants -->
    <script src="components/AuthPopup/AuthPopup.js"></script>
    <script src="components/Destinations/Destinations.js"></script>
    <script src="components/ChooseAddress/ChooseAddress.js"></script>
    
    <!-- Component Manager -->
    <script type="module">
        // Importer les composants
        import { ComponentManager } from './components/ComponentManager.js';
        
        // Enregistrer les composants
        ComponentManager.register('destinations', Destinations);
        
        // Exporter globalement
        window.ComponentManager = ComponentManager;
        window.Destinations = Destinations;
        window.ChooseAddress = ChooseAddress;
        
        // Initialiser les composants quand le DOM est prêt
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM prêt, initialisation des composants...');
            
            // Initialiser AuthPopup
            if (window.AuthPopup) {
                window.AuthPopup.init('authPopupContainer');
            }
            
            // Initialiser ChooseAddress
            if (window.ChooseAddress) {
                console.log('✅ ChooseAddress trouvé, initialisation...');
                window.ChooseAddress.init();
            } else {
                console.error('❌ ChooseAddress non trouvé');
            }
            
            // Initialiser Destinations
            if (window.Destinations) {
                window.Destinations.init();
            }
            
            await ComponentManager.initAll();
        });
    </script>
    
    <script>
        // Variables globales
        let searchTimeout;
        let currentSelectedResult;
        let isSearching = false;
        let isOnline = navigator.onLine;
        let destinationMarkers = []; // Stocker les marqueurs de destinations
        
        // Initialisation de la carte
        let map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            minZoom: 2,
            maxZoom: 18,
            worldCopyJump: false, // Désactiver la coupure visible
            continuousWorld: true, // Monde continu fluide
            zoomControl: false,
            maxBounds: [[-85, -Infinity], [85, Infinity]], // Bloquer vertical mais horizontal infini
            maxBoundsViscosity: 0.0, // Fluidité maximale
            inertia: true, // Scroll fluide
            bounceAtZoomLimits: false // Pas de rebond
        });
        
        // Différents styles de cartes
        const mapStyles = {
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }),
            satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '© Esri'
            }),
            terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenTopoMap'
            }),
            dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© CartoDB'
            })
        };
        
        // Style par défaut
        let currentLayer = mapStyles.osm;
        currentLayer.addTo(map);
        
        // Ajouter les contrôles de zoom
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);
        
        // Fonctions de carte
        function changeMapStyle() {
            const style = document.getElementById('mapStyle').value;
            map.removeLayer(currentLayer);
            currentLayer = mapStyles[style];
            currentLayer.addTo(map);
        }
        
        // Fonction pour afficher les destinations sur la carte
        async function displayDestinationsOnMap() {
            // Effacer les marqueurs existants
            destinationMarkers.forEach(marker => map.removeLayer(marker));
            destinationMarkers = [];
            
            if (!window.firebaseService.isAuthenticated()) {
                console.log('🔒 Utilisateur non connecté');
                return;
            }
            
            try {
                const destinations = await window.firebaseService.getDirectDestinations();
                
                if (destinations.length > 0) {
                    destinations.forEach((destination) => {
                        if (typeof destination === 'object' && destination.location && destination.location.lat && destination.location.lng) {
                            const name = destination.name || 'Destination sans nom';
                            
                            let popupContent = `
                                <div style="min-width: 200px;">
                                    <h4 style="margin: 0 0 5px 0; color: #333;">${name}</h4>`;
                            
                            if (destination.address && destination.address.trim() !== '') {
                                popupContent += `<p style="margin: 5px 0; color: #666;">${destination.address}</p>`;
                            }
                            
                            popupContent += `
                                    <p style="margin: 5px 0; font-size: 12px; color: #999;">Destination individuelle</p>
                                </div>`;
                            
                            const marker = L.marker([destination.location.lat, destination.location.lng])
                                .addTo(map)
                                .bindPopup(popupContent);
                            
                            destinationMarkers.push(marker);
                        }
                    });
                    
                    console.log(`✅ ${destinationMarkers.length} marqueur(s) affiché(s)`);
                    
                    // Ajuster la vue pour voir tous les marqueurs
                    const group = new L.featureGroup(destinationMarkers);
                    map.fitBounds(group.getBounds().pad(0.1));
                } else {
                    console.log('❌ Aucune destination à afficher');
                }
                
            } catch (error) {
                console.error('❌ Erreur affichage destinations:', error);
            }
        }
        
        // Mettre à jour l'affichage des destinations après connexion
        async function updateUserPanel() {
            const authBtn = document.querySelector('.auth-btn');
            let destinationsBtn = document.querySelector('.destinations-toggle-btn');
            
            if (window.firebaseService.isAuthenticated()) {
                // Utilisateur connecté
                if (window.Destinations) {
                    window.Destinations.loadDestinations();
                    window.Destinations.show();
                }
                
                // Afficher les destinations sur la carte après connexion
                displayDestinationsOnMap();
                
                // Changer le bouton en déconnexion
                if (authBtn) {
                    authBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2 2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    `;
                    authBtn.onclick = handleLogout;
                }
                
                // Créer le bouton destinations (styles dans styles.css)
                if (!destinationsBtn && window.Destinations) {
                    destinationsBtn = document.createElement('button');
                    destinationsBtn.className = 'destinations-toggle-btn';
                    destinationsBtn.innerHTML = '📍';
                    destinationsBtn.title = 'Destinations';
                    destinationsBtn.addEventListener('click', () => window.Destinations.toggle());
                    document.body.appendChild(destinationsBtn);
                }
            } else {
                // Utilisateur déconnecté
                if (authBtn) {
                    authBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                    `;
                    authBtn.onclick = () => AuthPopup.show();
                }
                
                // Cacher le bouton destinations
                if (destinationsBtn) {
                    destinationsBtn.style.display = 'none';
                }
            }
        }
        
        // Vérifier l'état de connexion au chargement
        window.firebase.auth.onAuthStateChanged(async (user) => {
            if (user) {
                window.firebaseService.user = user;
                console.log('Utilisateur connecté:', user.email);
                
                // Créer un itinéraire si aucun n'existe
                await window.firebaseService.ensureUserItinerary();
                
                updateUserPanel();
            } else {
                window.firebaseService.user = null;
                console.log('Utilisateur déconnecté');
                
                // Effacer les marqueurs lors de la déconnexion
                destinationMarkers.forEach(marker => map.removeLayer(marker));
                destinationMarkers = [];
                
                updateUserPanel();
            }
        });
        
        // Fonctions de popup (compatibilité)
        function closePopup(popupId) {
            if (popupId === 'authPopup') {
                window.AuthPopup.hide();
            }
        }
        
        // Fonction de déconnexion
        function handleLogout() {
            console.log('Tentative de déconnexion...');
            
            // Effacer les marqueurs avant la déconnexion
            destinationMarkers.forEach(marker => map.removeLayer(marker));
            destinationMarkers = [];
            
            if (window.firebaseService) {
                window.firebaseService.signOut()
                    .then(() => {
                        console.log('Déconnexion réussie');
                        updateUserPanel();
                        
                        // Réafficher le bouton de connexion
                        const authBtn = document.querySelector('.auth-btn');
                        if (authBtn) {
                            authBtn.style.display = 'flex';
                        }
                    })
                    .catch((error) => {
                        console.error('Erreur de déconnexion:', error);
                    });
            } else {
                console.error('FirebaseService non disponible pour la déconnexion');
            }
        }
        
        // Écouter les changements de connexion
        window.addEventListener('online', () => {
            isOnline = true;
            console.log('Connexion rétablie - API activée');
        });
        
        window.addEventListener('offline', () => {
            isOnline = false;
            console.log('Connexion perdue - API désactivée');
        });
        
        // Support tactile pour mobile
        if ('ontouchstart' in window) {
            map.dragging.enable();
            map.touchZoom.enable();
            map.doubleClickZoom.enable();
            map.scrollWheelZoom.enable();
        }
        
        // Calculer les limites en fonction de la taille de l'écran
        function getScreenBounds() {
            const bounds = map.getBounds();
            const screenLatRange = bounds.getNorth() - bounds.getSouth();
            const centerLat = map.getCenter().lat;
            
            // Calculer les limites pour que la carte remplisse exactement l'écran
            const maxNorth = centerLat + (screenLatRange / 2);
            const maxSouth = centerLat - (screenLatRange / 2);
            
            return {
                north: Math.min(maxNorth, 85),  // Ne pas dépasser 85°N
                south: Math.max(maxSouth, -85)  // Ne pas dépasser 85°S
            };
        }
        
        // Scroll horizontal fluide sans démarcation
        map.on('dragend', function() {
            const center = map.getCenter();
            const zoom = map.getZoom();
            const bounds = getScreenBounds();
            
            // Bloquer seulement vertical selon la taille de l'écran
            if (center.lat < bounds.south) center.lat = bounds.south;
            if (center.lat > bounds.north) center.lat = bounds.north;
            
            // Horizontal TOTALEMENT libre - pas de correction
            // continuousWorld: true gère le wrap automatiquement
            
            // Remettre seulement si on sort verticalement
            map.setView([center.lat, center.lng], zoom, { animate: false });
        });
        
        // Scroll fluide pendant le drag
        map.on('drag', function() {
            const center = map.getCenter();
            const bounds = getScreenBounds();
            
            // Bloquer seulement vertical pendant le drag
            if (center.lat < bounds.south || center.lat > bounds.north) {
                // Corriger seulement vertical
                const correctedLat = Math.max(bounds.south, Math.min(bounds.north, center.lat));
                map.setView([correctedLat, center.lng], map.getZoom(), { animate: false });
            }
        });
        
        // Contrôler le zoom
        map.on('zoomend', function() {
            const zoom = map.getZoom();
            if (zoom < 2) map.setZoom(2);
            if (zoom > 18) map.setZoom(18);
        });
        
        console.log('🌍 Carte configurée : horizontal fluide sans démarcation, vertical adapté');
        
        // Exporter les fonctions globalement
        window.displayDestinationsOnMap = displayDestinationsOnMap;
        window.updateUserPanel = updateUserPanel;
        window.changeMapStyle = changeMapStyle;
        window.map = map;
    </script>
</body>
</html>
