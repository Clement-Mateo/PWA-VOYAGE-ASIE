    <!-- Component Manager -->
    <script type="module">
        // Importer ComponentManager
        import { ComponentManager } from './components/ComponentManager.js';
        
        // Exporter globalement
        window.ComponentManager = ComponentManager;
        
        // Initialiser l'application quand le DOM est prêt
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Démarrage de l\'application via ComponentManager...');
            
            try {
                await ComponentManager.initAll();
                console.log('✅ Application initialisée avec succès');
            } catch (error) {
                console.error('❌ Erreur lors de l\'initialisation:', error);
            }
        });
    </script>
    
    <script>
        // Variables globales
        let searchTimeout;
        let currentSelectedResult;
        let isSearching = false;
        let isOnline = navigator.onLine;
        
        // Fonction de déconnexion
        function handleLogout() {
            console.log('Tentative de déconnexion...');
            
            if (window.MapInstance && window.MapInstance.cleanMap) {
                window.MapInstance.cleanMap();
            }
            
            if (window.firebaseService) {
                window.firebaseService.signOut()
                    .then(() => {
                        console.log('Déconnexion réussie');
                        // updateUserPanel est déjà appelé dans signOut()
                    })
                    .catch((error) => {
                        console.error('Erreur de déconnexion:', error);
                    });
            } else {
                console.error('FirebaseService non disponible pour la déconnexion');
            }
        }
        
        // Écouter les changements de connexion
        window.addEventListener('online', () => {
            isOnline = true;
            console.log('Connexion rétablie - API activée');
        });
        
        window.addEventListener('offline', () => {
            isOnline = false;
            console.log('Connexion perdue - API désactivée');
        });
        
        // Exporter les fonctions globalement
        window.handleLogout = handleLogout;
        
        // Écouter l'événement d'authentification prête (pour connexions manuelles)
        window.addEventListener('firebaseAuthReady', async (event) => {
            console.log('🔥 Événement firebaseAuthReady reçu');
            
            // Appeler updateUserPanel via ComponentManager
            if (window.ComponentManager && window.ComponentManager.updateUserPanel) {
                await window.ComponentManager.updateUserPanel();
            }
        });
        
        // Écouter aussi quand l'architecture offline-first est prête (pour F5)
        window.addEventListener('offlineFirstAppReady', async (event) => {
            console.log('🚀 Événement offlineFirstAppReady reçu');
            
            // Appeler updateUserPanel via ComponentManager
            if (window.ComponentManager && window.ComponentManager.updateUserPanel) {
                await window.ComponentManager.updateUserPanel();
            }
        });
    </script>
